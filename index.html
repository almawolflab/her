<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Proyecto Her — AlmaWolf</title>
<style>
  body { font-family: Inter, system-ui, sans-serif; background: #EDECEB; color: #1C1C2E; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { max-width: 480px; padding: 48px 32px; }
  .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 40px; }
  .logo svg { width: 20px; height: 20px; }
  .logo span { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  h1 { font-size: 32px; font-weight: 300; margin: 0 0 8px; }
  p { font-size: 14px; color: #6B7280; margin: 0 0 36px; }
  .versions { display: flex; flex-direction: column; gap: 10px; }
  .ver { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #D5D4D2; border-radius: 10px; padding: 16px 20px; text-decoration: none; color: inherit; transition: border-color .15s; }
  .ver:hover { border-color: #C13B2F; }
  .ver-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: #C13B2F; margin-bottom: 2px; }
  .ver-title { font-size: 15px; font-weight: 500; }
  .ver-date { font-size: 12px; color: #6B7280; }
  .arrow { color: #D5D4D2; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 20 20" fill="none"><polygon points="10,1 19,6 19,14 10,19 1,14 1,6" fill="#C13B2F"/></svg>
    <span>AlmaWolf · Proyecto Her</span>
  </div>
  <h1>Presentaciones</h1>
  <p>Versiones del deck de Proyecto Her.</p>
  <div class="versions">
    <a class="ver" href="v4/">
      <div>
        <div class="ver-label">Versión 4 · Actual</div>
        <div class="ver-title">Piloto Agosto 2026</div>
        <div class="ver-date">Septiembre 2026</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>
</body>
</html>
